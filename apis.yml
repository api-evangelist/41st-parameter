name: 41st Parameter
description: >-
  The 41st Parameter, Inc. was a device-identification and web-fraud-detection
  company founded in 2004 and headquartered in Silicon Valley, with offices in
  Arizona, the UK, and Tokyo. Its device intelligence technology reduced fraud
  detection false positives for use cases such as new-account fraud, card-not-present
  (CNP) online transaction risk scoring, and account-takeover protection. Experian
  acquired the company in October 2013 and folded its device-recognition technology
  into Experian's global web-fraud and risk-based identity-authentication portfolio
  (FraudNet). 41st Parameter no longer operates as a standalone entity and publishes
  no independent developer portal, API, or documentation. This profile was surfaced
  as a portfolio company of kleiner-perkins and retained in the API Evangelist
  network as a historical record.
